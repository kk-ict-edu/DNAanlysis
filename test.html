<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>クリック画像切替デモ</title>
<style>
  #mainImage {
    width: 600px;
    border: 1px solid #ccc;
    cursor: pointer;
  }
  #coord {
    position: absolute;
    background: rgba(255,255,255,0.8);
    padding: 4px 6px;
    border: 1px solid #aaa;
    font-size: 12px;
    pointer-events: none;
  }
  #textDisplay {
    width: 600px;
    height: 600px;
    border: 1px solid #ccc;
    display: none;
    font-size: 24px;
    padding: 20px;
    box-sizing: border-box;
    background: #fdfdfd;
    cursor: pointer;
  }
</style>
</head>
<body>

<h1 style="text-align: center;">プリンを食べた犯人を捜せ</h1>

<div style="position: relative; display: inline-block;">
  <img id="mainImage" src="" />
  <div id="coord"></div>
  <div id="textDisplay"></div>
</div>

<script>
/* ---------------------------------------------------------

--------------------------------------------------------- */
const base64Images = {
  home: "./home.png",
  img1: "./home.png",
  img2: "./home.png",
  img3: "./home.png",
  img4: "./home.png"
};

/* ---------------------------------------------------------
   座標設定（クリックした領域 → 表示する画像）
   画像の幅600pxを前提にしているが、自由に変更可能
--------------------------------------------------------- */
const clickMap = [
  { x1: 160,   y1: 300,   x2: 190, y2: 330, image: "img1" }, // 左上
  { x1: 15,   y1: 360,   x2: 60, y2: 400, image: "img2" }, // 右上
  { x1: 65,   y1: 80,   x2: 125, y2: 140, image: "img3" }, // 左下
  { x1: 490,   y1: 8,   x2: 585, y2: 160, image: "img4" },  // 右下
  { x1: 350, y1: 14,   x2: 484, y2: 165, text: "シンク" }, // 右上 → テキスト
];

const img = document.getElementById("mainImage");
const coord = document.getElementById("coord");
const textDisplay = document.getElementById("textDisplay");

img.src = base64Images.home;
let mode = "home";

/* 座標表示 */
img.addEventListener("mousemove", function(event) {
  const rect = img.getBoundingClientRect();
  const x = Math.floor(event.clientX - rect.left);
  const y = Math.floor(event.clientY - rect.top);

  coord.style.left = (event.clientX - rect.left + 10) + "px";
  coord.style.top  = (event.clientY - rect.top + 10) + "px";
  coord.textContent = `(${x}, ${y})`;
});

/* ホーム画像クリック → 画像 or テキスト表示 */
img.addEventListener("click", function(event) {

  const rect = img.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;

  // -------------------------
  // 画像表示中 → ホームに戻る
  // -------------------------
  if (mode === "image") {
    img.src = base64Images.home;
    img.style.display = "block";
    textDisplay.style.display = "none";
    mode = "home";
    return;
  }

  // -------------------------
  // ホーム画像のときだけ領域判定
  // -------------------------
  if (mode === "home") {

    const target = clickMap.find(area =>
      x >= area.x1 && x < area.x2 &&
      y >= area.y1 && y < area.y2
    );

    if (!target) return;

    // 画像表示
    if (target.image) {
      img.src = base64Images[target.image];
      img.style.display = "block";
      textDisplay.style.display = "none";
      mode = "image";
      return;
    }

    // テキスト表示
    if (target.text) {
      textDisplay.textContent = target.text;
      textDisplay.style.display = "block";
      img.style.display = "none";
      mode = "text";
      return;
    }
  }
});

textDisplay.addEventListener("click", function() {
  if (mode === "text") {
    textDisplay.style.display = "none";
    img.style.display = "block";
    img.src = base64Images.home;
    mode = "home";
  }
});

</script>

</body>
</html>
